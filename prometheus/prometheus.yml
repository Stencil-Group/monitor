global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "nexo-prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nexo-node-exporter"
    static_configs:
      - targets: ["3.231.81.240:9100"]

  - job_name: "nexo-cadvisor"
    static_configs:
      - targets: ["3.231.81.240:8085"]

  - job_name: "monitor-node-exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "monitor-cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "nexo-health-checks"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        # En AWS asumiendo que los endpoints están expuestos en estas rutas/puertos
        - "http://3.231.81.240:3000/api/health"
        - "http://3.231.81.240:8080/health"
        - "http://3.231.81.240:4321"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
